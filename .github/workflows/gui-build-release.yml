name: GUI builds and releases

on:
  push: {}
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($releaseVersion -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "Release tag must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH; got '$env:RELEASE_TAG'."
          }
          $packageVersion = (& python -c "from nemesis_gui import __version__; print(__version__)").Trim()
          if ($packageVersion -ne $releaseVersion) {
            throw "Release tag $releaseVersion does not match nemesis_gui.__version__ $packageVersion."
          }

      - name: Build the Windows executable
        shell: pwsh
        run: ./build-windows.ps1

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/windows/NemesisScanner.exe
            dist/windows/NemesisScanner-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            nmap rpm zstd curl python3-pip python3-tk python3-dev

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: linux-pip-

      - name: Install AppImage tooling
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH; got '$RELEASE_TAG'." >&2
            exit 1
          fi
          package_version="$(python3 -c 'from nemesis_gui import __version__; print(__version__)')"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "Release tag $release_version does not match nemesis_gui.__version__ $package_version." >&2
            exit 1
          fi

      - name: Build RPM and AppImage
        run: bash ./build-linux.sh

      - name: Build DEB and Arch packages
        run: bash ./build-deb-arch.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/nemesis-scanner-gui_*_all.deb
            dist/nemesis-scanner-gui-*-1.x86_64.rpm
            dist/nemesis-scanner-gui-*-1-any.pkg.tar.zst
            dist/NemesisScanner-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create the versioned release and attach all packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nemesis Scanner ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
