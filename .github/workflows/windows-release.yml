name: Windows release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build the Windows executable
        shell: pwsh
        run: ./build-windows.ps1

      - name: Attach the Windows app and portable bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/windows/NemesisScanner.exe
            dist/windows/NemesisScanner-*-windows-x64.zip
          fail_on_unmatched_files: true
